[package]
name = "kick-api"
version = "0.1.0"
edition.workspace = true
description = "Kick's APIs, shared by the Kick tools"

# Each feature brings in one part, so a tool pulls in only what it uses.
[features]
# Decoding the unofficial channel lookup, channel.
channel = ["dep:serde", "dep:serde_json"]
# Decoding realtime frames into Centrifugo's client protocol,
# realtime::centrifugo.
centrifugo = ["dep:serde", "dep:serde_json"]
# Decoding Kick's events from Centrifugo's publications, realtime::event.
protocol = ["centrifugo"]
# The realtime client, realtime::Client: raw frames, after Kick's setup,
# realtime::connection.
client = [
  "centrifugo",
  "dep:futures-util",
  "dep:getrandom",
  "dep:reqwest",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-tungstenite",
]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

futures-util = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[[test]]
name = "channel"
required-features = ["channel"]

[[test]]
name = "centrifugo"
required-features = ["centrifugo"]

[[test]]
name = "event"
required-features = ["protocol"]

[[test]]
name = "time"
required-features = ["protocol"]

[[test]]
name = "client"
required-features = ["client"]

[[example]]
name = "probe"
required-features = ["client"]
