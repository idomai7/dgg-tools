[package]
name = "kick-api"
version = "0.1.0"
edition.workspace = true
description = "Kick's APIs, shared by the Kick tools"

# Each feature brings in one part, so a tool pulls in only what it uses.
[features]
# Decoding the unofficial channel lookup, channel.
channel = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[test]]
name = "channel"
required-features = ["channel"]
