[package]
name = "dgg-api"
version = "0.1.0"
edition.workspace = true
description = "destiny.gg's APIs (chat, and more to come), shared by the dgg tools"

# Each feature brings in one part, so a tool pulls in only what it uses.
[features]
# The chat socket client, chat::Client: raw frames.
client = [
  "dep:futures-util",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-tungstenite",
]
# Decoding chat frames, chat::protocol.
protocol = ["dep:serde", "dep:serde_json"]
# Decoding chat's emotes and flairs, assets.
assets = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

futures-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
dotenvy.workspace = true
serde_json.workspace = true

[[example]]
name = "probe"
required-features = ["client"]

[[example]]
name = "history_check"
required-features = ["client"]

[[example]]
name = "decode_journal"
required-features = ["protocol"]

[[example]]
name = "send"
required-features = ["client", "protocol"]

[[test]]
name = "client"
required-features = ["client"]

[[test]]
name = "event"
required-features = ["protocol"]

[[test]]
name = "command"
required-features = ["protocol"]

[[test]]
name = "vestaboard"
required-features = ["protocol"]

[[test]]
name = "assets"
required-features = ["assets"]
