[package]
name = "dgg-api"
version = "0.1.0"
edition.workspace = true
description = "destiny.gg's APIs (chat, and more to come), shared by the dgg tools"

# Each feature brings in the I/O for one kind of API, so a tool pulls in
# only what it talks to; the types (and decoding them) need none.
[features]
# The chat socket client, chat::Client.
client = [
  "dep:futures-util",
  "dep:rustls",
  "dep:tokio",
  "dep:tokio-tungstenite",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true

futures-util = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[[example]]
name = "probe"
required-features = ["client"]

[[example]]
name = "history_check"
required-features = ["client"]

[[test]]
name = "client"
required-features = ["client"]
