[package]
name = "logger"
version = "0.1.0"
edition.workspace = true
description = "Captures dgg chat to a journal; indexes, compacts and syncs it"

[build-dependencies]
version-info.workspace = true

[dependencies]
dgg-api = { workspace = true, features = ["client"] }
logger-journal.workspace = true

axum.workspace = true
clap.workspace = true
futures-util.workspace = true
gethostname.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zstd.workspace = true

[dev-dependencies]
futures-util.workspace = true
tokio-tungstenite.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }
zstd.workspace = true
