[package]
name = "deploy"
version = "0.1.0"
edition.workspace = true
description = "dgg-logger: runs the logger's commands, and installs and inspects it"

[[bin]]
name = "dgg-logger"
path = "src/main.rs"

[[bin]]
name = "dgg-supervisor"
path = "src/bin/supervisor.rs"

[dependencies]
journal.workspace = true
logger.workspace = true

clap.workspace = true
ctrlc.workspace = true
ratatui.workspace = true
sysinfo.workspace = true

[build-dependencies]
version-info.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true
windows-service.workspace = true
