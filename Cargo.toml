[workspace]
resolver = "3"
members = [
  "common",
  "deploy",
  "dgg-api",
  "kick-api",
  "kick-mod",
  "linkers-api",
  "logger",
  "logger-journal",
  "rustlesearch-api",
  "version-info",
  "viewer",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
common = { path = "common" }
dgg-api = { path = "dgg-api" }
kick-api = { path = "kick-api" }
linkers-api = { path = "linkers-api" }
logger = { path = "logger" }
logger-journal = { path = "logger-journal" }
rustlesearch-api = { path = "rustlesearch-api" }
version-info = { path = "version-info" }

axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
embed-resource = "3.0.12"
dotenvy = "0.15.7"
fastrand = "2.5.0"
futures-util = "0.3.34"
gethostname = "1.1.0"
getrandom = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "webp"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "getrandom", "pem"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
win32job = "2.0.3"
windows-service = "0.8.1"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk", "system"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
zeroize = "1.9.1"
zstd = "0.14.3"
