[workspace]
resolver = "3"
members = ["deploy", "dgg-chat", "journal", "logger", "version-info", "viewer"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
dgg-chat = { path = "dgg-chat" }
journal = { path = "journal" }
version-info = { path = "version-info" }

axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = "3.5.2"
embed-resource = "3.0.12"
dotenvy = "0.15.7"
futures-util = "0.3.34"
gethostname = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
win32job = "2.0.3"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
zstd = "0.14.3"
