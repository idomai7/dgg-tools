[workspace]
resolver = "3"
members = ["dgg-chat", "journal", "logger", "viewer"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
dgg-chat = { path = "dgg-chat" }
journal = { path = "journal" }

axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
gethostname = "1.1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
