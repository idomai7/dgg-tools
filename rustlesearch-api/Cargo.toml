[package]
name = "rustlesearch-api"
version = "0.1.0"
edition.workspace = true
description = "rustlesearch.dev's API, a public archive of dgg chat"

# Decoding needs no feature.
[features]
# Fetching, Api.
http = ["dep:reqwest"]

[dependencies]
common.workspace = true
serde.workspace = true
serde_json.workspace = true

reqwest = { workspace = true, optional = true }

[dev-dependencies]
reqwest.workspace = true
tokio.workspace = true

[[test]]
name = "api"
required-features = ["http"]
