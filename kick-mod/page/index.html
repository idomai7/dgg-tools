<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kick-mod</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #fafafa;
    --ink: #1a1a1a;
    --faint: #6b6b6b;
    --line: #dddddd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #161616;
      --ink: #e8e8e8;
      --faint: #9a9a9a;
      --line: #333333;
    }
  }
  body {
    margin: 0;
    padding: 1rem;
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.4 system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1rem;
    align-items: baseline;
    margin: 0 0 1rem;
  }
  h1 { font-size: 1.1rem; margin: 0; }
  a { color: inherit; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0.1rem 0.5rem;
    cursor: pointer;
  }
  table { border-collapse: collapse; }
  th, td {
    padding: 0.3rem 0.8rem 0.3rem 0;
    border-bottom: 1px solid var(--line);
    text-align: left;
  }
  th { color: var(--faint); font-weight: normal; }
  .faint { color: var(--faint); }
</style>
</head>
<body>
<header>
  <h1>kick-mod</h1>
  <span id="account" class="faint">…</span>
</header>
<div id="channels" class="faint">Loading the channels…</div>
<script>
  const shown = document.getElementById("channels");
  const account = document.getElementById("account");

  async function showAccount() {
    const answer = await fetch("/api/me");
    if (!answer.ok) {
      account.textContent = `Kick didn't say who's signed in: ${await answer.text()}`;
      return;
    }
    const { user } = await answer.json();
    if (!user) {
      const link = document.createElement("a");
      link.href = "/sign-in";
      link.textContent = "Sign in with Kick";
      account.className = "";
      account.replaceChildren(link);
      return;
    }
    const out = document.createElement("button");
    out.textContent = "Sign out";
    out.onclick = async () => {
      await fetch("/api/sign-out", { method: "POST" });
      showAccount();
    };
    account.className = "";
    account.replaceChildren(`Signed in as ${user.name ?? user.user_id} `, out);
  }

  async function show() {
    const answer = await fetch("/api/channels");
    if (!answer.ok) {
      shown.textContent = `The channels didn't load: ${await answer.text()}`;
      return;
    }
    const channels = Object.entries(await answer.json());
    if (channels.length === 0) {
      shown.textContent = "No channels yet: add one with kick-mod ids <slug>.";
      return;
    }
    const table = document.createElement("table");
    const head = table.insertRow();
    for (const name of ["Channel", "Broadcaster", "Chatroom"]) {
      const cell = document.createElement("th");
      cell.textContent = name;
      head.append(cell);
    }
    for (const [slug, channel] of channels) {
      const row = table.insertRow();
      row.insertCell().textContent = slug;
      row.insertCell().textContent = channel.broadcaster_user_id;
      row.insertCell().textContent =
        channel.chatroom_id ?? "unknown: enter it in channels.json";
    }
    shown.className = "";
    shown.replaceChildren(table);
  }

  showAccount().catch((error) => {
    account.textContent = `Kick didn't say who's signed in: ${error}`;
  });
  show().catch((error) => {
    shown.textContent = `The channels didn't load: ${error}`;
  });
</script>
</body>
</html>
